<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1790" viewBox="0 0 1800 1790"><title>A balanced page of text and ornament</title><desc>Source-guided teaching arrangement after New Spencerian Compendium Plates 51 and 55, supplied physical pages 129 and 133. The original bird routes and verse are redrawn with continuous Bezier curves and combined to demonstrate negative space, hierarchy, and balance.</desc><rect width="1800" height="1790" fill="#fff" /><svg width="1270" height="835" viewBox="-32 -32 1264 834" x="265" y="20">

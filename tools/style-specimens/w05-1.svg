<svg xmlns="http://www.w3.org/2000/svg" width="99.0" height="96.0" viewBox="0 0 99 96"><title>2 · fine-line numeral study</title><desc>Fine-line style adaptation of the verified 2 source outline from Spencerian Key to Practical Penmanship, PDF page 98. The source outline was rasterized at 12 times native resolution, reduced to its medial centerline, and fitted with smooth curves. The original numeral identity and counters are retained. No pressure shades, loops, or numeral forms were copied from the user photograph.</desc><rect width="99.0" height="96.0" fill="#fff" /><g fill="none" stroke="#20362d" stroke-width=".72" stroke-linecap="round" stroke-linejoin="round"><path d="M 67.417,30.168 C 65.552,34.314 63.288,38.577 59.929,41.990 C 58.252,43.695 56.302,45.188 53.857,45.667 C 52.787,45.877 51.622,45.892 50.864,45.382 C 50.062,44.843 49.716,43.715 49.605,42.626 C 49.135,37.975 52.969,34.036 56.517,30.795 C 58.359,29.113 60.124,27.618 62.373,26.677 C 64.235,25.897 66.429,25.497 68.315,26.115 C 69.459,26.491 70.490,27.242 71.192,28.228 C 71.826,29.118 72.192,30.198 72.384,31.295 C 72.727,33.257 72.512,35.270 72.031,37.163 C 70.892,41.646 68.261,45.455 65.139,49.077 C 61.674,53.098 57.605,56.888 53.486,60.100 C 51.560,61.602 49.622,62.978 47.474,64.008 C 46.487,64.481 45.455,64.881 44.592,65.485 C 43.665,66.133 42.932,67.016 42.335,68.168" /><path d="M 70.584,60.334 C 67.071,63.123 63.654,66.757 59.556,68.543 C 56.232,69.991 52.460,70.225 48.497,70.283 C 47.520,70.297 46.532,70.301 45.628,70.141 C 45.155,70.058 44.705,69.929 44.301,69.703 C 43.845,69.449 43.448,69.071 43.003,68.802 C 41.481,67.882 39.403,68.240 37.496,68.113 C 35.545,67.983 33.775,67.344 31.897,67.149 C 30.089,66.961 28.182,67.184 26.416,67.583" /></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="90.0" height="94.0" viewBox="0 0 90 94"><title>4 · fine-line numeral study</title><desc>Fine-line style adaptation of the verified 4 source outline from Spencerian Key to Practical Penmanship, PDF page 98. The source outline was rasterized at 12 times native resolution, reduced to its medial centerline, and fitted with smooth curves. The original numeral identity and counters are retained. No pressure shades, loops, or numeral forms were copied from the user photograph.</desc><rect width="90.0" height="94.0" fill="#fff" /><g fill="none" stroke="#20362d" stroke-width=".72" stroke-linecap="round" stroke-linejoin="round"><path d="M 65.085,25.084 C 61.052,30.547 57.102,36.045 53.263,41.589 C 51.387,44.298 49.537,47.018 47.841,49.802 C 46.259,52.398 44.812,55.050 44.076,57.997" /><path d="M 43.503,31.417 C 41.226,36.432 38.824,41.315 35.735,45.992 C 34.085,48.490 32.238,50.930 30.485,53.309 C 29.631,54.468 28.800,55.613 28.141,57.047 C 27.851,57.678 27.595,58.365 27.711,58.881 C 27.771,59.148 27.930,59.369 28.182,59.513 C 28.397,59.636 28.680,59.702 28.964,59.752 C 31.319,60.169 33.804,59.477 36.279,59.451 C 37.528,59.437 38.774,59.593 39.867,59.487 C 40.193,59.455 40.505,59.400 40.804,59.288 C 41.121,59.170 41.422,58.987 41.740,58.819 C 42.252,58.548 42.805,58.313 43.379,58.202 C 44.544,57.975 45.793,58.260 47.070,58.372 C 48.280,58.478 49.515,58.431 50.749,58.413 C 53.167,58.377 55.583,58.454 58.000,58.416" /><path d="M 40.333,59.750 C 40.235,63.170 38.698,65.993 37.000,68.750" /></g></svg>
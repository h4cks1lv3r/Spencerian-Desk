name: Verify app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dom/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests/dom
      - name: Test app flows and vector geometry
        run: |
          node --test tests/dom/app.integration.test.cjs
          node --test tests/signature/source-render.test.cjs
          node --test tools/tests/practice_geometry.test.js
          python3 -m unittest discover -s tools/tests -p '*_test.py'
      - name: Install Android build packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test native boundaries
        run: sh tests/native/run.sh "$ANDROID_HOME"
      - name: Build with a temporary CI signing identity
        run: python3 build_apk.py --sdk "$ANDROID_HOME" --output output/The-Spencerian-Desk-CI.apk
      - name: Retain CI package for inspection
        uses: actions/upload-artifact@v7
        with:
          name: ci-apk-separate-signing-identity
          path: |
            output/The-Spencerian-Desk-CI.apk
            output/The-Spencerian-Desk-CI.apk.sha256
          retention-days: 7
          if-no-files-found: error

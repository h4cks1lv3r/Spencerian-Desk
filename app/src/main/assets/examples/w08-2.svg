<svg xmlns="http://www.w3.org/2000/svg" width="99.0" height="119.0" viewBox="0 0 99 119"><title>9 · fine-line numeral study</title><desc>Fine-line style adaptation of the verified 9 source outline from Spencerian Key to Practical Penmanship, PDF page 100. The source outline was rasterized at 12 times native resolution, reduced to its medial centerline, and fitted with smooth curves. The original numeral identity and counters are retained. No pressure shades, loops, or numeral forms were copied from the user photograph.</desc><rect width="99.0" height="119.0" fill="#fff" /><g fill="none" stroke="#20362d" stroke-width=".72" stroke-linecap="round" stroke-linejoin="round"><path d="M 58.917,48.001 C 55.492,48.296 52.822,50.456 50.081,52.418 C 47.278,54.424 44.400,56.223 41.222,57.341 C 39.844,57.826 38.409,58.182 36.850,58.249 C 36.039,58.283 35.194,58.240 34.533,57.931 C 33.792,57.585 33.280,56.905 33.028,56.137 C 32.590,54.809 32.926,53.217 33.473,51.778 C 34.096,50.140 34.991,48.702 35.990,47.310 C 40.353,41.229 46.682,36.048 52.881,32.052 C 55.709,30.228 58.510,28.651 61.630,27.348 C 64.357,26.208 67.328,25.277 70.376,25.883 C 71.259,26.058 72.148,26.363 72.620,26.993 C 73.043,27.557 73.132,28.382 73.070,29.159 C 72.938,30.794 72.130,32.215 71.246,33.584 C 69.234,36.701 66.823,39.553 64.259,42.318 C 62.966,43.712 61.633,45.084 60.429,46.494 C 59.849,47.172 59.300,47.858 58.918,48.631 C 58.595,49.288 58.392,50.007 58.136,50.704 C 56.940,53.953 54.568,56.713 52.277,59.509 C 47.520,65.314 43.114,71.274 38.591,77.169 C 36.343,80.100 34.066,83.014 31.910,85.998 C 29.750,88.988 27.712,92.049 24.833,94.584" /></g></svg>
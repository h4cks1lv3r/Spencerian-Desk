<svg xmlns="http://www.w3.org/2000/svg" width="111.0" height="100.0" viewBox="0 0 111 100"><title>8 · fine-line numeral study</title><desc>Fine-line style adaptation of the verified 8 source outline from Spencerian Key to Practical Penmanship, PDF page 100. The source outline was rasterized at 12 times native resolution, reduced to its medial centerline, and fitted with smooth curves. The original numeral identity and counters are retained. No pressure shades, loops, or numeral forms were copied from the user photograph.</desc><rect width="111.0" height="100.0" fill="#fff" /><g fill="none" stroke="#20362d" stroke-width=".72" stroke-linecap="round" stroke-linejoin="round"><path d="M 85.334,28.833 C 79.470,28.748 73.740,29.690 68.582,31.579" /><path d="M 68.168,34.170 C 67.365,34.465 66.512,34.640 65.662,34.822 C 64.848,34.996 64.037,35.177 63.258,35.437 C 61.540,36.011 59.982,36.973 58.416,37.915 C 55.330,39.772 52.213,41.552 48.748,42.496" /><path d="M 64.499,45.333 C 66.134,43.243 67.556,41.137 68.099,38.587 C 68.328,37.513 68.401,36.359 68.337,35.255 C 68.304,34.680 68.234,34.119 68.275,33.557 C 68.316,33.006 68.464,32.454 68.409,31.943 C 68.344,31.333 67.989,30.782 67.626,30.226 C 67.258,29.661 66.882,29.091 66.399,28.640 C 65.526,27.826 64.300,27.402 63.070,27.172 C 60.772,26.742 58.456,26.987 56.431,28.005 C 53.952,29.251 51.908,31.654 50.361,33.956 C 49.659,34.999 49.060,36.022 48.674,37.230 C 48.333,38.293 48.158,39.500 48.203,40.594 C 48.227,41.172 48.313,41.719 48.392,42.240 C 48.435,42.519 48.476,42.791 48.480,43.078 C 48.484,43.346 48.457,43.626 48.425,43.922 C 48.364,44.480 48.286,45.092 48.047,45.586 C 47.762,46.176 47.246,46.598 46.773,47.041 C 46.284,47.498 45.842,47.978 45.435,48.564 C 45.066,49.095 44.726,49.714 44.558,50.256 C 44.472,50.532 44.431,50.788 44.479,51.033 C 44.535,51.319 44.714,51.589 44.853,51.906 C 45.074,52.409 45.195,53.030 45.242,53.636 C 45.427,56.026 44.462,58.178 43.433,60.236 C 42.279,62.543 41.045,64.730 39.605,66.917 C 38.10
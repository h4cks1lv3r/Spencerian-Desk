<svg xmlns="http://www.w3.org/2000/svg" width="113.0" height="124.0" viewBox="0 0 113 124"><title>7 · fine-line numeral study</title><desc>Fine-line style adaptation of the verified 7 source outline from Spencerian Key to Practical Penmanship, PDF page 99. The source outline was rasterized at 12 times native resolution, reduced to its medial centerline, and fitted with smooth curves. The original numeral identity and counters are retained. No pressure shades, loops, or numeral forms were copied from the user photograph.</desc><rect width="113.0" height="124.0" fill="#fff" /><g fill="none" stroke="#20362d" stroke-width=".72" stroke-linecap="round" stroke-linejoin="round"><path d="M 53.500,24.083 C 52.554,25.677 51.404,27.166 50.867,28.930 C 50.627,29.720 50.509,30.565 50.270,31.347 C 50.146,31.755 49.989,32.146 49.780,32.510 C 49.551,32.907 49.261,33.272 48.961,33.632 C 47.706,35.137 46.271,36.558 44.930,38.072 C 43.554,39.625 42.277,41.277 40.831,42.832" /><path d="M 78.750,29.249 C 79.056,28.423 79.228,27.107 79.767,26.282 C 80.311,25.448 81.230,25.114 82.380,24.957 C 83.460,24.810 84.744,24.817 85.262,25.469 C 85.553,25.836 85.602,26.407 85.457,26.933 C 85.318,27.434 85.003,27.894 84.610,28.246 C 83.844,28.931 82.785,29.204 81.740,29.288 C 80.761,29.366 79.795,29.279 78.873,29.408 C 76.828,29.696 74.998,31.054 73.083,31.824 C 72.597,32.019 72.105,32.177 71.603,32.146 C 71.134,32.117 70.657,31.924 70.154,31.807 C 69.240,31.594 68.243,31.635 67.253,31.658 C 65.285,31.703 63.346,31.678 61.422,31.749 C 59.430,31.823 57.453,32.000 55.590,32.350 C 54.621,32.533 53.683,32.762 52.686,32.974 C 51.692,33.186 50.640,33.381 49.833,32.834" /><path d="M 71.679,32.338 C 70.610,35.306 68.955,38.031 67.070,40.661 C 65.047,43.482 62.758,46.193 60.511,48.921 C 56.021,54.373 51.697,59.893 47.577,65.497 C 43.542,70.988 39.703,76.559 35.767,82.091 C 31.898,87.529 27.934,92.930 24.573,98.579" /></g></svg>
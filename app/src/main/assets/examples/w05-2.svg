<svg xmlns="http://www.w3.org/2000/svg" width="90.0" height="101.0" viewBox="0 0 90 101"><title>3 · fine-line numeral study</title><desc>Fine-line style adaptation of the verified 3 source outline from Spencerian Key to Practical Penmanship, PDF page 98. The source outline was rasterized at 12 times native resolution, reduced to its medial centerline, and fitted with smooth curves. The original numeral identity and counters are retained. No pressure shades, loops, or numeral forms were copied from the user photograph.</desc><rect width="90.0" height="101.0" fill="#fff" /><g fill="none" stroke="#20362d" stroke-width=".72" stroke-linecap="round" stroke-linejoin="round"><path d="M 56.250,30.750 C 55.084,31.219 54.094,32.133 53.392,33.204 C 53.042,33.736 52.764,34.307 52.313,34.675 C 51.928,34.990 51.417,35.156 50.873,35.324 C 50.312,35.498 49.716,35.674 49.199,35.602 C 48.655,35.526 48.200,35.176 47.940,34.713 C 47.489,33.907 47.632,32.760 48.002,31.764 C 48.461,30.528 49.270,29.525 50.177,28.671 C 51.076,27.825 52.071,27.126 53.213,26.597 C 55.154,25.696 57.522,25.284 59.300,26.300 C 60.337,26.893 61.174,27.972 61.547,29.159 C 61.860,30.157 61.846,31.232 61.978,32.261 C 62.047,32.800 62.156,33.326 62.026,33.799 C 61.873,34.353 61.390,34.835 60.997,35.354 C 60.279,36.302 59.859,37.374 59.233,38.338 C 57.878,40.424 55.554,42.007 53.489,43.269 C 52.999,43.569 52.524,43.850 51.945,43.900 C 51.477,43.941 50.940,43.829 50.421,43.762 C 49.901,43.694 49.398,43.671 48.917,43.626 C 48.392,43.578 47.893,43.504 47.417,43.250" /><path d="M 52.833,43.919 C 54.135,46.446 54.601,49.987 54.310,53.125 C 54.004,56.423 52.862,59.278 51.280,62.109 C 47.749,68.426 42.024,74.627 34.886,75.781 C 33.385,76.023 31.822,76.043 30.367,75.533 C 28.592,74.911 26.978,73.502 26.039,71.886 C 24.460,69.166 24.797,65.860 25.849,62.858 C 28.273,55.940 34.492,50.631 41.000,48.083" /></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="106.0" height="100.0" viewBox="0 0 106 100"><title>5 · fine-line numeral study</title><desc>Fine-line style adaptation of the verified 5 source outline from Spencerian Key to Practical Penmanship, PDF page 99. The source outline was rasterized at 12 times native resolution, reduced to its medial centerline, and fitted with smooth curves. The original numeral identity and counters are retained. No pressure shades, loops, or numeral forms were copied from the user photograph.</desc><rect width="106.0" height="100.0" fill="#fff" /><g fill="none" stroke="#20362d" stroke-width=".72" stroke-linecap="round" stroke-linejoin="round"><path d="M 80.167,26.334 C 77.513,25.349 74.694,25.626 71.665,25.489 C 70.162,25.421 68.607,25.251 67.455,25.915 C 66.727,26.334 66.160,27.087 65.634,27.815 C 65.114,28.534 64.633,29.229 64.116,29.919 C 62.011,32.727 59.298,35.466 57.509,38.308 C 57.308,38.628 57.118,38.950 56.871,39.190 C 56.644,39.411 56.368,39.563 56.045,39.654 C 55.432,39.827 54.647,39.781 53.918,39.822 C 52.343,39.912 51.028,40.415 49.750,41.166" /><path d="M 57.083,39.417 C 58.513,40.764 59.535,42.552 59.867,44.454 C 60.146,46.052 59.937,47.729 59.568,49.318 C 58.726,52.954 57.048,56.130 54.819,59.154 C 52.298,62.577 49.071,65.806 45.670,68.356 C 42.629,70.636 39.448,72.373 35.819,73.408 C 34.215,73.865 32.524,74.184 30.858,73.932 C 28.979,73.648 27.132,72.636 26.418,71.001 C 25.804,69.594 26.030,67.726 26.362,66.072 C 26.720,64.284 27.201,62.746 27.823,61.181 C 28.499,59.478 29.342,57.743 30.509,56.254 C 31.154,55.431 31.898,54.684 32.646,53.915 C 33.367,53.173 34.092,52.412 34.860,51.747 C 36.325,50.478 37.946,49.557 39.618,48.666 C 41.272,47.784 42.975,46.931 44.583,45.999" /></g></svg>